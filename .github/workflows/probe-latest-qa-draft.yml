name: probe-latest-qa-draft

on:
  push:
    branches:
      - qa/browser-fullflow-20260919-v2
    paths:
      - scripts/probe_latest_qa_draft.py
      - .github/workflows/probe-latest-qa-draft.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/probe_latest_qa_draft.py
