name: replay-5015-production

on:
  push:
    branches:
      - ops/replay-5015-prod-20260919
    paths:
      - scripts/prod_replay_5015.py
      - .github/workflows/replay-5015-prod.yml

permissions:
  contents: read

concurrency:
  group: replay-5015-production
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 70
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check one-time replay runner
        run: python -m py_compile scripts/prod_replay_5015.py

      - name: Replay historical 5015 as a new production task
        run: python scripts/prod_replay_5015.py
