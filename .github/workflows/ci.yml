name: ci

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler types
      - run: npx tsc --noEmit
      - run: npm test
      - run: cmp scripts/validate_r2_f10_golden_delivery.py cadcore/runner/validate_r2_f10_golden_delivery.py
      - run: python -m py_compile cadcore/runner/*.py
      - run: python scripts/check_concept_machine.py
      - run: npm run deploy:dry
