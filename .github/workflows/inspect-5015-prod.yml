name: inspect-5015-production
# probe-seq: 3

on:
  push:
    branches:
      - ops/rework-5015-prod-20260919
    paths:
      - .github/workflows/inspect-5015-prod.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only production task status
        shell: bash
        run: |
          set -euo pipefail
          SQL="SELECT t.id,t.state,t.quality_status,t.workflow_instance_id,t.updated_at,(SELECT COUNT(DISTINCT stage_id) FROM artifacts a WHERE a.task_id=t.id AND a.status='ACCEPTED' AND a.kind='stage-report') AS accepted_stages,(SELECT status FROM delivery_packages d WHERE d.task_id=t.id ORDER BY d.created_at DESC LIMIT 1) AS delivery_status,(SELECT code FROM workflow_incidents i WHERE i.task_id=t.id ORDER BY i.created_at DESC LIMIT 1) AS latest_incident_code FROM tasks t WHERE t.id='43abb382-b774-4104-b38e-caee6cdfda44';"
          npx wrangler d1 execute automation-chief-engineer-cloud --remote --json --command "$SQL"
