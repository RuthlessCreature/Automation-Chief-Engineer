name: probe-post-create-switch

on:
  push:
    branches:
      - qa/browser-fullflow-20260919-v3
    paths:
      - test/probe-post-create-switch.spec.ts
      - .github/workflows/probe-post-create-switch.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test test/probe-post-create-switch.spec.ts --workers=1 --reporter=line
