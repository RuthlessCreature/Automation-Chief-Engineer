name: rework-5015-production

on:
  push:
    branches:
      - ops/rework-5015-prod-20260919
    paths:
      - scripts/prod_rework_5015.py
      - .github/workflows/rework-5015-prod.yml

permissions:
  contents: read

concurrency:
  group: rework-5015-production
  cancel-in-progress: false

jobs:
  rework:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check one-time rework runner
        run: python -m py_compile scripts/prod_rework_5015.py

      - name: Rework historical 5015 production task and validate final ZIP
        run: python scripts/prod_rework_5015.py
