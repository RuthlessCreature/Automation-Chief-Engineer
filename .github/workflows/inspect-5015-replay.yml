name: inspect-5015-replay

on:
  push:
    branches:
      - ops/inspect-5015-replay-20260919
    paths:
      - .github/workflows/inspect-5015-replay.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read replay state only
        run: |
          npx wrangler d1 execute automation-chief-engineer-cloud --remote --json --command "SELECT t.id,t.state,t.quality_status,t.last_error_code,t.created_at FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1; SELECT COUNT(*) AS accepted_stage_reports FROM artifacts WHERE task_id=(SELECT t.id FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1) AND kind='stage-report' AND status='ACCEPTED'; SELECT stage_id,created_at FROM artifacts WHERE task_id=(SELECT t.id FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1) AND kind='stage-report' AND status='ACCEPTED' ORDER BY created_at DESC LIMIT 3; SELECT status AS delivery_status,sha256,frozen_at FROM delivery_packages WHERE task_id=(SELECT t.id FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1) LIMIT 1; SELECT code,severity,source,status,detail_json,created_at FROM workflow_incidents WHERE task_id=(SELECT t.id FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1) ORDER BY created_at DESC LIMIT 5; SELECT action,created_at FROM audit_events WHERE task_id=(SELECT t.id FROM tasks t JOIN users u ON u.id=t.owner_id WHERE u.email='test@test.com' AND t.title='5015 | Golden-121 PROD rerun | 2026-09-19' ORDER BY t.created_at DESC LIMIT 1) ORDER BY created_at DESC LIMIT 10; SELECT t.id,t.state,t.created_at,(SELECT COUNT(*) FROM task_inputs i WHERE i.task_id=t.id) AS input_count,(SELECT COUNT(*) FROM cad_jobs c WHERE c.task_id=t.id AND c.status='SUCCEEDED') AS cad_success_count,(SELECT COUNT(*) FROM delivery_packages d WHERE d.task_id=t.id AND d.status='FROZEN' AND d.zip_key IS NOT NULL) AS frozen_delivery_count FROM tasks t WHERE t.title LIKE '%5015%' OR t.prompt LIKE '%5015%' OR EXISTS (SELECT 1 FROM task_inputs i WHERE i.task_id=t.id AND i.original_name LIKE '%5015%') OR EXISTS (SELECT 1 FROM artifacts a WHERE a.task_id=t.id AND a.title LIKE '%5015%') ORDER BY CASE WHEN t.state='PACKAGED' THEN 0 ELSE 1 END,t.created_at ASC LIMIT 10; SELECT CASE WHEN (SELECT prompt FROM tasks WHERE id='08c11498-ae33-4817-be7b-e57f02aa4817')=(SELECT prompt FROM tasks WHERE id='2b98d2bb-52cf-471d-ad6f-9a2c309a06c3') THEN 1 ELSE 0 END AS same_prompt,(SELECT COUNT(*) FROM task_inputs WHERE task_id='2b98d2bb-52cf-471d-ad6f-9a2c309a06c3' AND (lower(original_name) LIKE '%.step' OR lower(original_name) LIKE '%.stp' OR lower(original_name) LIKE '%.stl')) AS cad_input_count,(SELECT COUNT(*) FROM task_inputs WHERE task_id='2b98d2bb-52cf-471d-ad6f-9a2c309a06c3' AND intake_status='STAGED_FORMAT_VALIDATED') AS validated_input_count"

