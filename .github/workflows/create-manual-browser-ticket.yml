name: create-manual-browser-ticket

on:
  push:
    branches:
      - ops/manual-browser-auth-20260920
    paths:
      - .github/workflows/create-manual-browser-ticket.yml

permissions:
  contents: read

jobs:
  ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create short-lived test-account browser session
        shell: bash
        run: |
          set -euo pipefail
          TICKET="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          USER_ID="$(npx wrangler d1 execute automation-chief-engineer-cloud --remote --json --command "SELECT id FROM users WHERE email='test@test.com' LIMIT 1;" | python -c "import json,sys; d=json.load(sys.stdin); print((d[0] if isinstance(d,list) else d)['results'][0]['id'])")"
          EXPIRES="$(python - <<'PY'
          import datetime as dt
          print((dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=60)).isoformat().replace('+00:00','Z'))
          PY
          )"
          CREATED="$(python - <<'PY'
          import datetime as dt
          print(dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'))
          PY
          )"
          npx wrangler d1 execute automation-chief-engineer-cloud --remote --command "INSERT INTO sessions (id,user_id,expires_at,created_at) VALUES ('$TICKET','$USER_ID','$EXPIRES','$CREATED');"
          echo "MAGIC_URL=https://zg.gaona.world/api/auth/manual-browser-ticket?ticket=$TICKET"
          echo "EXPIRES_AT=$EXPIRES"
