name: cleanup-browser-e2e-session

on:
  push:
    branches:
      - ops/browser-e2e-20260920
    paths:
      - .github/workflows/cleanup-browser-e2e-session.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete temporary browser E2E session
        run: npx wrangler d1 execute automation-chief-engineer-cloud --remote --command "DELETE FROM sessions WHERE id='6905a2c4-648b-4978-a6d4-657eebc2fcb0';"
